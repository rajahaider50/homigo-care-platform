name: HomiGo Care CI

on:
  push:
    branches: [fresh-rebuild]
  pull_request:
    branches: [fresh-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web typecheck, lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Java 21 for the Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Firestore rules against the Emulator
        run: pnpm test:rules
      - name: Verify Public Website
        run: |
          pnpm --filter @homigo/public-web typecheck
          pnpm --filter @homigo/public-web lint
          pnpm --filter @homigo/public-web test
          pnpm --filter @homigo/public-web build
      - name: Verify Admin Panel
        run: |
          pnpm --filter @homigo/admin-web typecheck
          pnpm --filter @homigo/admin-web lint
          pnpm --filter @homigo/admin-web test
          pnpm --filter @homigo/admin-web build

  android:
    name: Android lint, unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Restore ignored Firebase Android config
        id: firebase-config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > apps/android/app/google-services.json
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Validate Firebase Android config without printing values
        if: steps.firebase-config.outputs.available == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("apps/android/app/google-services.json").read_text())
          project_id = config.get("project_info", {}).get("project_id")
          client = next(
              (
                  item
                  for item in config.get("client", [])
                  if item.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name") == "pk.homigocare.android"
              ),
              None,
          )
          oauth_clients = client.get("oauth_client", []) if client else []
          if project_id != "homigo-care-dev-20261010" or client is None or not oauth_clients:
              raise SystemExit("Firebase Android config failed project/package/OAuth validation.")
          print("Firebase Android config passed project/package/OAuth validation; values withheld.")
          PY
      - name: Restore and validate registered development signing key
        id: signing-key
        if: steps.firebase-config.outputs.available == 'true'
        env:
          HOMIGO_DEV_KEY_B64: ${{ secrets.HOMIGO_DEV_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$HOMIGO_DEV_KEY_B64" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/homigo-care-dev-20261010-debug.keystore"
          printf '%s' "$HOMIGO_DEV_KEY_B64" | tr -d '\r\n' | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey > "$RUNNER_TEMP/dev-key-details.txt"
          python3 - "$RUNNER_TEMP/dev-key-details.txt" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text()
          sha1 = re.search(r"SHA1:\s*([0-9A-F:]+)", text, re.I)
          sha256 = re.search(r"SHA256:\s*([0-9A-F:]+)", text, re.I)
          expected_sha1 = "F4:4A:F8:1E:50:99:63:1E:5C:49:A2:78:D0:7B:BD:13:57:35:98:E9"
          expected_sha256 = "09:BF:4F:EC:5B:FE:A4:23:0E:27:B7:20:36:3C:46:74:CE:BA:54:7E:8E:FD:79:8D:14:44:C2:63:E6:C2:AF:40"
          if not sha1 or not sha256 or sha1.group(1).upper() != expected_sha1 or sha256.group(1).upper() != expected_sha256:
              raise SystemExit("Development keystore fingerprints do not match the registered Firebase certificate.")
          print("Development keystore SHA-1/SHA-256 match the registered Firebase certificate; values withheld.")
          PY
          echo "HOMIGO_DEV_DEBUG_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Set up Android SDK
        if: steps.firebase-config.outputs.available == 'true' && steps.signing-key.outputs.available == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Verify native app
        if: steps.firebase-config.outputs.available == 'true' && steps.signing-key.outputs.available == 'true'
        working-directory: apps/android
        env:
          HOMIGO_DEV_DEBUG_STORE_PASSWORD: android
          HOMIGO_DEV_DEBUG_KEY_ALIAS: androiddebugkey
          HOMIGO_DEV_DEBUG_KEY_PASSWORD: android
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleDebug
      - name: Verify APK certificate matches registered Firebase fingerprints
        if: steps.firebase-config.outputs.available == 'true' && steps.signing-key.outputs.available == 'true'
        working-directory: apps/android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/apk-certificate.txt"
          python3 - "$RUNNER_TEMP/apk-certificate.txt" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text()
          sha1 = re.search(r"SHA-1 digest:\s*([0-9A-F]+)", text, re.I)
          sha256 = re.search(r"SHA-256 digest:\s*([0-9A-F]+)", text, re.I)
          expected_sha1 = "F44AF81E5099631E5C49A278D07BBD13573598E9"
          expected_sha256 = "09BF4FECB5FEA4230E27B720363C4674CEBA547E8EFD798D1444C263E6C2AF40"
          if not sha1 or not sha256 or sha1.group(1).upper() != expected_sha1 or sha256.group(1).upper() != expected_sha256:
              raise SystemExit("Built APK signature does not match the registered Firebase development certificate.")
          print("APK SHA-1/SHA-256 match the registered Firebase certificate; values withheld.")
          PY
      - name: Upload development debug APK
        if: steps.firebase-config.outputs.available == 'true' && steps.signing-key.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: homigo-care-debug-apk-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Report required repository secret
        if: steps.firebase-config.outputs.available != 'true'
        run: echo "::notice title=Android CI skipped::Add the Firebase Android configuration as the repository Actions secret FIREBASE_ANDROID_GOOGLE_SERVICES_JSON to enable this job. The local configuration is intentionally ignored and not committed."
      - name: Report required registered development signing key
        if: steps.firebase-config.outputs.available == 'true' && steps.signing-key.outputs.available != 'true'
        run: echo "::notice title=Android CI paused::Add the registered development keystore as the repository Actions secret HOMIGO_DEV_DEBUG_KEYSTORE_BASE64. Android lint/build/artifact steps intentionally do not fall back to the runner's default key."
