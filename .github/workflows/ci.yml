name: HomiGo Care CI

on:
  push:
    branches: [fresh-rebuild]
  pull_request:
    branches: [fresh-rebuild]

permissions:
  contents: read

jobs:
  web:
    name: Web typecheck, lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Java 21 for the Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Firestore rules against the Emulator
        run: pnpm test:rules
      - name: Verify Public Website
        run: |
          pnpm --filter @homigo/public-web typecheck
          pnpm --filter @homigo/public-web lint
          pnpm --filter @homigo/public-web test
          pnpm --filter @homigo/public-web build
      - name: Verify Admin Panel
        run: |
          pnpm --filter @homigo/admin-web typecheck
          pnpm --filter @homigo/admin-web lint
          pnpm --filter @homigo/admin-web test
          pnpm --filter @homigo/admin-web build

  android:
    name: Android lint, unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Restore ignored Firebase Android config
        id: firebase-config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > apps/android/app/google-services.json
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Set up Android SDK
        if: steps.firebase-config.outputs.available == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Verify native app
        if: steps.firebase-config.outputs.available == 'true'
        working-directory: apps/android
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleDebug
      - name: Report required repository secret
        if: steps.firebase-config.outputs.available != 'true'
        run: echo "::notice title=Android CI skipped::Add the Firebase Android configuration as the repository Actions secret FIREBASE_ANDROID_GOOGLE_SERVICES_JSON to enable this job. The local configuration is intentionally ignored and not committed."
